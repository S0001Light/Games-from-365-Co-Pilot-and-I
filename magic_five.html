<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magic Five</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050710;color:#eef2ff;font-family:Arial,sans-serif}.app{width:min(620px,92vw);padding:20px;text-align:center;background:radial-gradient(circle at 50% 35%,#263254,#080b16 62%,#02030a);border-radius:24px;box-shadow:0 16px 50px #0008}h1{margin:0 0 4px}.sub{color:#aab4d3}.arena{position:relative;height:330px;overflow:hidden;border-radius:50%;background:radial-gradient(circle at 38% 28%,#35405d,#121625 40%,#030409 72%);border:7px solid #090a0f;box-shadow:inset 0 0 45px #000,0 10px 28px #0009}.pent{position:absolute;width:90px;height:90px;display:grid;place-items:center;padding:9px;box-sizing:border-box;font-size:13px;font-weight:bold;text-shadow:0 2px 3px #000;clip-path:polygon(50% 0,98% 36%,80% 100%,20% 100%,2% 36%);background:linear-gradient(145deg,#635bff,#29207d);transition:left .9s ease,top .9s ease,transform .9s ease,opacity .35s,filter .35s}.pent.selected{background:linear-gradient(145deg,#39ddff,#1858ff);filter:drop-shadow(0 0 16px #55dfff);z-index:10}button{margin-top:18px;padding:14px 32px;border:0;border-radius:999px;background:#735cff;color:#fff;font-size:18px;font-weight:bold;cursor:pointer;box-shadow:0 7px 20px #0008}button:active{transform:scale(.96)}.result{min-height:36px;margin-top:13px;font-size:24px;font-weight:bold;color:#8ee9ff}
</style>
</head>
<body>
<main class="app">
<h1>Magic Five</h1><p class="sub">Think of a question, then ask.</p>
<div class="arena" id="arena"><div class="pent">YES</div><div class="pent">NO</div><div class="pent">MAYBE</div><div class="pent">POSSIBLE</div><div class="pent">DEFINITELY<br>NOT</div></div>
<button id="ask" type="button">ASK</button><div class="result" id="result">Think of your question...</div>
</main>
<script>
const arena=document.getElementById('arena'), pent=[...document.querySelectorAll('.pent')], result=document.getElementById('result');
const answers=['YES','NO','MAYBE','POSSIBLE','DEFINITELY NOT']; let selected=-1;
function floatShapes(){pent.forEach((x,i)=>{if(i===selected)return;const maxX=Math.max(10,arena.clientWidth-105),maxY=Math.max(10,arena.clientHeight-105);x.style.left=(8+Math.random()*maxX)+'px';x.style.top=(8+Math.random()*maxY)+'px';x.style.transform=`rotate(${Math.random()*40-20}deg) scale(${.82+Math.random()*.18})`;x.style.opacity='.82';});}
floatShapes(); setInterval(floatShapes,1050);
document.getElementById('ask').addEventListener('click',()=>{selected=-1;pent.forEach(x=>x.classList.remove('selected'));result.textContent='The shapes are deciding...';let n=0;const spin=setInterval(()=>{selected=Math.floor(Math.random()*pent.length);pent.forEach((x,i)=>x.classList.toggle('selected',i===selected));if(++n>=9){clearInterval(spin);pent.forEach((x,i)=>{if(i!==selected){x.classList.remove('selected');x.style.opacity='.18'}else{x.style.left='calc(50% - 45px)';x.style.top='120px';x.style.opacity='1';x.style.transform='scale(1.35)'}});result.textContent=answers[selected];setTimeout(()=>{pent.forEach(x=>x.style.opacity='.82');selected=-1;floatShapes()},2400);}},130);});
window.addEventListener('resize',floatShapes);
</script>
</body>
</html>
